const sheet=document.querySelector('#sheet');function open(title,body){sheet.querySelector('h2').textContent=title;sheet.querySelector('.dialog-body').innerHTML=body;sheet.showModal()}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>theme(b.dataset.theme));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(e=>e.setAttribute('aria-pressed',e===b));render()});document.addEventListener('input',e=>{if(e.target.matches('[aria-label=\"搜索演示词句\"]')){query=e.target.value.toLowerCase();render()}});
document.addEventListener('click',event=>{const flip=event.target.closest('[data-flip]'),speak=event.target.closest('[data-speak]'),more=event.target.closest('[data-more]');if(flip){const id=Number(flip.dataset.flip);flipped.has(id)?flipped.delete(id):flipped.add(id);render()}if(speak){const e=entries.find(e=>e.id===Number(speak.dataset.speak));if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(e.text);u.lang='en-US';speechSynthesis.speak(u)}else open('设备不支持朗读','<p>仍可翻卡查看表达。</p>')}if(more)open('词卡更多操作','<p class="dialog-note">操作收在这里；此预览不修改数据。</p><div class="dialog-options"><button disabled>编辑</button><button disabled>造句</button><button disabled>删除</button></div>');const action=event.target.closest('[data-action]')?.dataset.action;if(action==='settings')open('外观','<p>右上角仍是全局设置入口。此预览可在顶部切换三套皮肤。</p>');if(action==='filter')open('筛选与排序','<div class="dialog-options"><button data-order="recent">最近记录</button><button data-order="alpha">字母顺序</button></div><p class="dialog-note">原有完整来源、标签筛选与排序需保留，默认收起。</p>');if(action==='capture')open('记录新表达','<input aria-label="演示输入" placeholder="想记下的英文表达"><p class="dialog-note">仅演示输入面板，保存仍使用原版完整记录流程。</p>');if(action==='play'){const b=document.querySelector('[data-speak]');if(b)b.click();else open('播放器预览','<p>这里只演示播放器排布，音频仍使用正式素材。</p>')}if(action==='nav-material')showMaterials();else if(action?.startsWith('nav-'))open('模块预览范围','<p>这一页先确认首页词卡细节。其他模块按同一套间距、图标和颜色对齐，保留原有功能。</p>');if(action==='home')showHome();if(event.target.closest('[data-close]'))sheet.close();const order=event.target.closest('[data-order]')?.dataset.order;if(order){entries.sort(order==='alpha'?(a,b)=>a.text.localeCompare(b.text):(a,b)=>a.id-b.id);render();sheet.close()}});render();

const homeMarkup=document.querySelector('.app-content').innerHTML;let library='listening',topic='全部',parentView='materials';
const lessons=[['Camera','摄影','兴趣爱好'],['Favorite Place','最喜欢的地方','出行旅行'],['Weekend Get-away','周末出游','出行旅行'],['Reading','阅读习惯','兴趣爱好'],['Music','音乐喜好','兴趣爱好'],['Driving','驾驶经历','日常生活'],['Weather','天气与季节','日常生活'],['Recipe','分享食谱','日常生活']];
const currentContent=()=>document.querySelector('.app-content');
function activate(name){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.action===name))}
function appHeader(title,trail,back){return `<header class="context-header"><button class="icon" data-return="${back}" aria-label="返回${back==='home'?'本子':'上一级'}">${icon('back')}</button><h2>${title}</h2><button class="icon" data-action="settings" aria-label="全局设置">${icon('settings')}</button></header><div class="breadcrumb">${trail.map((t,i)=>`${i?icon('chevron'):''}<span>${t}</span>`).join('')}</div>`}
function showHome(){currentContent().innerHTML=homeMarkup;filter='all';query='';render();currentContent().scrollTop=0;activate('home')}
const moreButton=title=>`<button class="cover-more" data-cover-menu="${title}" aria-label="${title}更多操作">${icon('more')}</button>`;
function program(title,subtitle,style,label,tag,action='collection'){return `<article class="program-card"><button class="program-open" data-open="${action}" data-name="${title}"><div class="program-art ${style}">${label}</div><strong>${title}</strong><small>${subtitle}</small>${tag?`<span class="tag">${tag}</span>`:''}</button>${moreButton(title)}</article>`}
function showMaterials(){activate('nav-material');let content='';if(library==='listening')content=program('Life Kit','6 集 · B2 参考','','Life<br>Kit','生活实用')+program('ELLLO','8 段 · A2 参考','elllo','ELLLO<small>REAL CONVERSATIONS</small>','短篇对话','elllo')+program('ESLPod','5 集 · A2 参考','cream','ESLPod','慢速讲解')+program('Planet Money','6 集 · B2 参考','ochre','Planet<br>Money','叙事逻辑');else if(library==='reading')content=program('Alice','Lewis Carroll','cover','<img src="../../public/covers/alice.webp" alt="爱丽丝封面">','B1 参考','reader')+program('Huckleberry Finn','Mark Twain','cream','Huckleberry<br>Finn','A1 参考','reader');else if(library==='course')content=program('走遍美国','26 课 · A2–B1 参考','family','Family<br>Album USA','课程');else content='<p class="screen-note">此预览聚焦入口与层级，保留独立的精选视频和我的收集。</p>';currentContent().innerHTML=appHeader('素材',['素材',{listening:'听力',reading:'阅读',course:'课程',video:'精选视频',links:'我的收集'}[library]],'home')+`<nav class="library-tabs" aria-label="素材主库">${[['listening','听力'],['reading','阅读'],['course','课程'],['video','精选'],['links','收集']].map(([id,label])=>`<button class="${library===id?'active':''}" data-library="${id}">${label}</button>`).join('')}</nav><div class="material-tools"><label class="search">${icon('search')}<input placeholder="搜索节目、书籍" aria-label="演示素材搜索"></label><button class="icon" data-action="filter" aria-label="筛选素材">${icon('filter')}</button><button class="icon" data-action="capture" aria-label="导入素材">${icon('plus')}</button></div><h3 class="section-label">${library==='listening'?'按节目听':library==='reading'?'我的书架':'课程与系列'}</h3><div class="program-grid">${content}</div><p class="screen-note">展示部分示例。ELLLO 与其他节目在同一层级，进入后按主题选单集。</p>`;currentContent().scrollTop=0}
function showElllo(){parentView='elllo';activate('nav-material');currentContent().innerHTML=appHeader('ELLLO',['素材','听力','短篇对话','ELLLO'],'materials')+`<div class="episode-top"><div class="program-art elllo">ELLLO</div><div><h3>真实日常对话</h3><p>8 段 · A2 参考</p><p>听原文，记一句，再开口</p></div></div><div class="topic-filters">${['全部','日常生活','兴趣爱好','出行旅行'].map(t=>`<button data-topic="${t}" class="${topic===t?'active':''}">${t}</button>`).join('')}</div>${lessons.filter(l=>topic==='全部'||l[2]===topic).map(l=>`<article class="episode"><button data-lesson="${l[0]}"><strong>${l[1]}</strong><small>${l[0]} · ${l[2]}</small></button>${moreButton(l[1])}</article>`).join('')}`;currentContent().scrollTop=0}
function showLesson(title='Reading'){activate('nav-material');currentContent().innerHTML=appHeader('听力详情',['素材','听力','ELLLO',title],'elllo')+`<div class="player-preview"><h3>${title}</h3><div class="play-row"><button class="icon" data-action="play" aria-label="试听">${icon('play')}</button><div class="track"><span></span></div><span>播放器预览</span></div></div><h3 class="section-label">原文与表达</h3><div class="transcript-demo"><p>I like reading in the evening.<small>示例字幕，仅用于界面排版。</small></p></div><div class="related-action"><button data-from-lesson="record">${icon('plus')}记下这句</button><button data-from-lesson="practice">${icon('chat')}开口复述</button></div><p class="screen-note">左上角始终回到当前单集所在节目；转去复述后可原路返回。</p>`;currentContent().scrollTop=0}
function showRetell(){currentContent().innerHTML=appHeader('开口复述',['素材','听力','ELLLO','Reading','复述'],'lesson')+`<h3 class="section-label">试着说说你的阅读习惯</h3><p>When do you like reading?</p><div class="player-preview"><button class="icon" data-action="play" aria-label="示例朗读">${icon('volume')}</button><p class="screen-note">界面预览，不录音。左上角返回刚才的听力素材。</p></div>`;currentContent().scrollTop=0}
document.addEventListener('click',event=>{const screen=event.target.closest('[data-screen]')?.dataset.screen;if(screen==='home')showHome();if(screen==='materials')showMaterials();if(screen==='elllo')showElllo();if(screen==='lesson')showLesson();const lib=event.target.closest('[data-library]')?.dataset.library;if(lib){library=lib;showMaterials()}const topicButton=event.target.closest('[data-topic]');if(topicButton){topic=topicButton.dataset.topic;showElllo()}const openButton=event.target.closest('[data-open]');if(openButton){if(openButton.dataset.open==='elllo')showElllo();else open('节目 / 书籍预览','<p>其他素材也使用同样的左上返回、路径和三点菜单。</p>')}const menu=event.target.closest('[data-cover-menu]');if(menu)open(menu.dataset.coverMenu,'<p class="dialog-note">统一三点菜单；全局设置仅在页面右上角。</p><div class="dialog-options"><button disabled>更换封面</button><button disabled>整理归属</button></div>');const back=event.target.closest('[data-return]')?.dataset.return;if(back==='home')showHome();if(back==='materials')showMaterials();if(back==='elllo')showElllo();if(back==='lesson')showLesson();const lesson=event.target.closest('[data-lesson]')?.dataset.lesson;if(lesson)showLesson(lesson);if(event.target.closest('[data-from-lesson=practice]'))showRetell();if(event.target.closest('[data-from-lesson=record]'))open('记下这句','<p>沿用原版完整记录面板，并保留返回素材的路径。</p>');const f=event.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b===f));render()}});
</script></html>
