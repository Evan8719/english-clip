<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>英语剪贴本 · 第一批听说素材</title>
  <style>
    :root{color-scheme:light;--paper:#f5f0e7;--card:#fffdf8;--ink:#292722;--muted:#756f65;--line:#ded5c6;--sage:#66755c;--sage-soft:#e7ebdf;--clay:#b86f51;--shadow:0 16px 48px rgba(72,57,38,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;line-height:1.6}button,a{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:42px 24px 72px}.mast{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;margin-bottom:28px}.eyebrow{margin:0 0 8px;color:var(--sage);font-size:13px;letter-spacing:.14em}.mast h1{margin:0;font-family:Georgia,"Songti SC",serif;font-size:clamp(30px,5vw,52px);font-weight:500;line-height:1.16}.intro{max-width:560px;margin:12px 0 0;color:var(--muted)}.back{color:var(--sage);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px}.list,.practice{background:var(--card);border:1px solid rgba(134,118,94,.18);border-radius:22px;box-shadow:var(--shadow)}.list{padding:12px;align-self:start;position:sticky;top:18px}.lesson{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px 12px;border:0;border-radius:14px;background:transparent;text-align:left;color:inherit}.lesson:hover{background:#f7f3eb}.lesson.active{background:var(--sage-soft)}.num{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--sage);font-family:Georgia,serif}.lesson.active .num{background:var(--sage);color:white;border-color:var(--sage)}.lesson strong{display:block;font-size:15px}.lesson small{color:var(--muted)}.time{font-size:12px;color:var(--muted)}.practice{padding:clamp(20px,4vw,42px)}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.pill{padding:4px 10px;border-radius:999px;background:#f0ece3;color:var(--muted);font-size:12px}.practice h2{margin:0;font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:clamp(27px,4vw,40px);line-height:1.2}.original-title{margin:5px 0 24px;color:var(--muted)}audio{width:100%;margin:4px 0 10px;accent-color:var(--sage)}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.soft,.primary,.speed{border:1px solid var(--line);border-radius:10px;background:#fffdf8;color:var(--ink);padding:8px 12px}.soft:hover,.speed:hover{border-color:var(--sage)}.primary{background:var(--sage);color:#fff;border-color:var(--sage)}.speed.active{background:var(--sage-soft);border-color:var(--sage)}.marker{margin-left:auto;color:var(--muted);font-size:13px}.section{margin-top:32px;padding-top:26px;border-top:1px solid var(--line)}.section h3{font-size:15px;letter-spacing:.08em;margin:0 0 14px}.focus{display:flex;gap:8px;flex-wrap:wrap}.phrase{border:1px solid #d4dacb;background:var(--sage-soft);color:#3f493a;border-radius:999px;padding:7px 12px}.prompt{padding:17px 18px;border-left:3px solid var(--clay);background:#fbf4ee;border-radius:0 12px 12px 0}.transcript{display:grid;gap:8px}.turn{margin:0;padding:12px 14px;border-radius:12px;border:1px solid transparent}.turn:hover{border-color:var(--line);background:#faf7f1}.turn::selection,.turn *::selection{background:#d9dfcf}.selection-tools{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;color:var(--muted);font-size:13px}.source{color:var(--sage)}.quiet{font-size:13px;color:var(--muted)}.notice{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#282720;color:white;padding:10px 15px;border-radius:999px;transition:.2s;pointer-events:none}.notice.show{opacity:1;transform:translate(-50%,0)}footer{max-width:780px;margin:34px auto 0;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:780px){.shell{padding:28px 14px 56px}.mast{display:block}.back{display:inline-block;margin-top:16px}.layout{grid-template-columns:1fr}.list{position:static;display:flex;overflow:auto}.lesson{min-width:230px}.practice{padding:22px 18px}.marker{width:100%;margin:2px 0 0}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div><p class="eyebrow">ENGLISH CLIP · LISTEN & SPEAK</p><h1>第一批听说素材</h1><p class="intro">8 段短对话，适合反复听、跟读和复述。没有打卡压力；挑一段，慢慢练熟就好。</p></div>
      <a class="back" href="../../">回到英语剪贴本</a>
    </header>
    <div class="layout">
      <nav class="list" id="lessonList" aria-label="素材列表"></nav>
      <article class="practice">
        <div class="meta"><span class="pill" id="topic"></span><span class="pill" id="level"></span><span class="pill" id="duration"></span></div>
        <h2 id="titleZh"></h2><p class="original-title" id="title"></p>
        <audio id="audio" controls preload="metadata"></audio>
        <div class="controls">
          <button class="soft" id="back5" type="button">− 5 秒</button><button class="soft" id="forward5" type="button">+ 5 秒</button>
          <button class="soft" id="setA" type="button">设 A 点</button><button class="soft" id="setB" type="button">设 B 点</button><button class="primary" id="loop" type="button" aria-pressed="false">循环：关</button>
          <button class="speed active" data-speed="1" type="button">1×</button><button class="speed" data-speed="0.8" type="button">0.8×</button><button class="speed" data-speed="0.65" type="button">0.65×</button>
          <span class="marker" id="marker">A — · B —</span>
        </div>
        <section class="section"><h3>这次留意</h3><div class="focus" id="focus"></div><p class="quiet">这些是英语剪贴本整理的练习方向；用词以原音频和原文为准。</p></section>
        <section class="section"><h3>复述一下</h3><div class="prompt" id="retell"></div></section>
        <section class="section"><div class="selection-tools"><h3>原文</h3><button class="soft" id="copySelection" type="button">复制选中文字</button></div><div class="transcript" id="transcript"></div><p class="quiet">原课没有逐句时间轴，因此不猜测对齐。需要精听时，请先播放到位置，再手动设置 A、B 点。</p></section>
        <section class="section"><a class="source" id="source" target="_blank" rel="noreferrer">打开 ELLLO 原课程 ↗</a><p class="quiet" id="speakers"></p></section>
      </article>
    </div>
    <footer>素材来自 ELLLO，供教育学习、非商业使用并保留来源。练习提示与页面编排由英语剪贴本整理。</footer>
  </main>
  <div class="notice" id="notice" role="status"></div>
  <script src="catalog.js"></script>
  <script>
    (()=>{
      const catalog=window.ENGLISH_CLIP_STARTER; if(!catalog?.items?.length){document.body.textContent='素材目录未加载。';return}
      const $=id=>document.getElementById(id), list=$('lessonList'), audio=$('audio'), state={index:0,a:null,b:null,loop:false,loadToken:0,objectUrl:null};
      const fmt=seconds=>{const value=Math.max(0,Math.round(Number(seconds)||0));return Math.floor(value/60)+':'+String(value%60).padStart(2,'0')}
      const toast=message=>{const el=$('notice');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1800)}
      const copy=async text=>{if(!text)return toast('请先在原文里选中文字');try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove()}toast('已复制，可以回到本子记录')}
      function renderList(){list.replaceChildren(...catalog.items.map((item,index)=>{const button=document.createElement('button');button.type='button';button.className='lesson'+(index===state.index?' active':'');button.innerHTML='<span class="num">'+String(index+1).padStart(2,'0')+'</span><span><strong></strong><small></small></span><span class="time"></span>';button.querySelector('strong').textContent=item.titleZh;button.querySelector('small').textContent=item.topic;button.querySelector('.time').textContent=fmt(item.durationSeconds);button.onclick=()=>select(index);return button}))}
      async function loadAudio(item,remembered,token){audio.pause();audio.removeAttribute('src');audio.load();if(state.objectUrl){URL.revokeObjectURL(state.objectUrl);state.objectUrl=null}const apply=url=>{if(token!==state.loadToken)return;audio.addEventListener('loadedmetadata',()=>{if(token===state.loadToken&&remembered>0&&remembered<audio.duration-2)audio.currentTime=remembered},{once:true});audio.src=url;audio.playbackRate=1;audio.load()};try{const response=await fetch(item.audio);if(!response.ok)throw new Error('audio '+response.status);const blob=await response.blob();if(token!==state.loadToken)return;state.objectUrl=URL.createObjectURL(blob);apply(state.objectUrl)}catch{apply(item.audio)}}
      function select(index){const item=catalog.items[index], remembered=Number(localStorage.getItem('english-clip-material:'+item.slug)||0), token=++state.loadToken;state.index=index;state.a=null;state.b=null;state.loop=false;void loadAudio(item,remembered,token);$('topic').textContent=item.topic;$('level').textContent=item.level;$('duration').textContent=fmt(item.durationSeconds);$('titleZh').textContent=item.titleZh;$('title').textContent=item.title;$('retell').textContent=item.retell;$('source').href=item.sourceUrl;$('speakers').textContent='说话人：'+item.speakers;$('focus').replaceChildren(...item.focus.map(text=>{const button=document.createElement('button');button.type='button';button.className='phrase';button.textContent=text;button.title='点击复制';button.onclick=()=>copy(text);return button}));$('transcript').replaceChildren(...item.lines.map(line=>{const p=document.createElement('p');p.className='turn';p.textContent=line.text;p.title='双击复制这一段';p.ondblclick=()=>copy(line.text);return p}));updateLoop();document.querySelectorAll('.speed').forEach((button,i)=>button.classList.toggle('active',i===0));renderList();window.scrollTo({top:0,behavior:'smooth'})}
      function updateLoop(){const display=value=>value==null?'—':fmt(value);$('marker').textContent='A '+display(state.a)+' · B '+display(state.b);$('loop').textContent='循环：'+(state.loop?'开':'关');$('loop').setAttribute('aria-pressed',String(state.loop));if(state.loop&&state.a!=null&&state.b!=null&&state.b>state.a&&audio.currentTime>state.b)audio.currentTime=state.a}
      $('back5').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('forward5').onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+5);$('setA').onclick=()=>{state.a=audio.currentTime;if(state.b!=null&&state.b<=state.a)state.b=null;updateLoop()};$('setB').onclick=()=>{if(state.a==null)return toast('请先设置 A 点');if(audio.currentTime<=state.a)return toast('B 点需要在 A 点之后');state.b=audio.currentTime;updateLoop()};$('loop').onclick=()=>{if(state.a==null||state.b==null)return toast('请先设置 A、B 两点');state.loop=!state.loop;if(state.loop&&(audio.currentTime<state.a||audio.currentTime>state.b))audio.currentTime=state.a;updateLoop()};audio.ontimeupdate=()=>{const item=catalog.items[state.index];if(Math.floor(audio.currentTime)%3===0)localStorage.setItem('english-clip-material:'+item.slug,String(audio.currentTime));if(state.loop&&state.a!=null&&state.b!=null&&audio.currentTime>=state.b){audio.currentTime=state.a;audio.play().catch(()=>{})}};document.querySelectorAll('.speed').forEach(button=>button.onclick=()=>{audio.playbackRate=Number(button.dataset.speed);document.querySelectorAll('.speed').forEach(item=>item.classList.toggle('active',item===button))});$('copySelection').onclick=()=>copy(String(getSelection()).trim());select(0)
    })()
  </script>
</body>
</html>
